<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caira HQ — Identity Management</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 0.85rem;
      color: #666;
      margin-top: 4px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .tab {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #2a2a2a;
      background: transparent;
      color: #666;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s;
    }

    .tab.active {
      background: #1a1a1a;
      border-color: #444;
      color: #ffffff;
    }

    .form-section {
      display: none;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 28px;
    }

    .form-section.active {
      display: block;
    }

    .form-section h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.8rem;
      color: #888;
      font-weight: 500;
    }

    input, select {
      background: #0f0f0f;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 10px 12px;
      color: #e0e0e0;
      font-size: 0.9rem;
      transition: border-color 0.15s;
      width: 100%;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #555;
    }

    select option {
      background: #1a1a1a;
    }

    button[type="submit"] {
      margin-top: 24px;
      width: 100%;
      padding: 12px;
      background: #ffffff;
      color: #0f0f0f;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button[type="submit"]:hover {
      background: #e0e0e0;
    }

    .offboard-submit {
      background: #ff4444 !important;
      color: #ffffff !important;
    }

    .offboard-submit:hover {
      background: #cc0000 !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Caira HQ — Identity Management</h1>
      <p>Onboarding and offboarding requests are submitted as pull requests to GitHub and provisioned via Terraform.</p>
    </header>

    <div class="tabs">
      <button class="tab active" onclick="showTab('onboard')">Onboard User</button>
      <button class="tab" onclick="showTab('offboard')">Offboard User</button>
    </div>

    <!-- Onboard Form -->
    <div id="onboard" class="form-section active">
      <h2>New User Onboarding</h2>
      <form action="/onboard/add" method="POST">
        <div class="form-grid">
          <div class="form-group">
            <label for="first_name">First Name</label>
            <input type="text" id="first_name" name="first_name" required>
          </div>
          <div class="form-group">
            <label for="last_name">Last Name</label>
            <input type="text" id="last_name" name="last_name" required>
          </div>
          <div class="form-group full-width">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="user@cairahq.com" required>
          </div>
          <div class="form-group full-width">
            <label for="title">Job Title</label>
            <input type="text" id="title" name="title" required>
          </div>
          <div class="form-group">
            <label for="department">Department</label>
            <input type="text" id="department" name="department" required>
          </div>
          <div class="form-group">
            <label for="division">Division</label>
            <input type="text" id="division" name="division" required>
          </div>
          <div class="form-group">
            <label for="manager">Manager (optional)</label>
            <input type="text" id="manager" name="manager">
          </div>
          <div class="form-group">
            <label for="user_type">User Type</label>
            <select id="user_type" name="user_type" required>
              <option value="">Select...</option>
              <option value="Employee">Employee</option>
              <option value="Contractor">Contractor</option>
            </select>
          </div>
        </div>
        <button type="submit">Submit Onboarding Request</button>
      </form>
    </div>

    <!-- Offboard Form -->
    <div id="offboard" class="form-section">
      <h2>User Offboarding</h2>
      <form action="/onboard/remove" method="POST">
        <div class="form-grid">
          <div class="form-group">
            <label for="off_first_name">First Name</label>
            <input type="text" id="off_first_name" name="first_name" required>
          </div>
          <div class="form-group">
            <label for="off_last_name">Last Name</label>
            <input type="text" id="off_last_name" name="last_name" required>
          </div>
          <div class="form-group full-width">
            <label for="off_email">Email Address</label>
            <input type="email" id="off_email" name="email" placeholder="user@cairahq.com" required>
          </div>
        </div>
        <button type="submit" class="offboard-submit">Submit Offboarding Request</button>
      </form>
    </div>
  </div>

  <script>
    function showTab(tab) {
      document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
